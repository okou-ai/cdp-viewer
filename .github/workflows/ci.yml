name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CDP_VIEWER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CDP_VIEWER_SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm css:check
      - run: pnpm build
      - run: pnpm build:demo
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm knip
      - run: pnpm test:unit
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run browser tests
        id: browser_tests
        run: pnpm test:browser
      - name: Save browser failure diagnostics
        if: ${{ failure() && steps.browser_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/trace.zip
            test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 7
